<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주소 조회 · Propedia 프리토타입</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="band">강남구 · 공개 고시·계획 문서 10종과 브이월드 토지 정보로 만든 시연용 프리토타입입니다.</div>
<main>
  <h1>주소 조회</h1>
  <form class="search" id="search-form" autocomplete="off">
    <input type="text" id="q" placeholder="예: 서울특별시 강남구 테헤란로 427 또는 강남구 일원동 619" aria-label="주소">
    <button class="btn primary" type="submit">조회</button>
  </form>
  <div class="chips" id="chips"></div>
  <p class="small muted">강남구 도로명주소나 지번 주소를 입력하세요. 아래 시연 주소를 눌러도 됩니다.</p>
  <div id="notices"></div>
  <div id="result"></div>
</main>
<script src="assets/app.js"></script>
<script src="assets/lookup.js"></script>
</body>
</html>
